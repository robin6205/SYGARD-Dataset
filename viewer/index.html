<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ORD track viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">SYGARD DATASET</p>
        <h1>Track replay</h1>
      </div>
      <div class="dataset-name" id="dataset-name">Loading dataset…</div>
    </header>

    <main class="map-wrap">
      <div id="map" aria-label="OpenStreetMap with tracks and cameras"></div>
      <div class="map-tools">
        <label class="map-toggle"><input id="show-tracks" type="checkbox" checked>Tracks</label>
        <label class="map-toggle"><input id="camera-only" type="checkbox" title="Hide simulation reference positions and show camera tracker output">Camera tracks only</label>
        <label class="map-toggle"><input id="show-cameras" type="checkbox" checked>Cameras</label>
        <button id="fit-airport" type="button">Camera area</button>
        <button id="fit-all" type="button">All paths</button>
      </div>
      <div class="map-status" aria-live="polite">
        <div class="line-legend"><span class="legend-line solid"></span>Simulation positions <span class="legend-line dashed"></span>Camera track estimates <span class="legend-note">· Color identifies the ID</span></div>
        <div id="active-count">Loading map…</div>
      </div>
      <div id="selection-card" class="selection-card" aria-live="polite" hidden>
        <button id="close-selection" type="button" aria-label="Close track details">×</button>
        <h2 id="detail-title">Track details</h2>
        <p id="detail-body"></p>
      </div>
    </main>

    <footer class="timeline">
      <div class="timeline-row">
        <button id="play" type="button" class="play" aria-label="Play">▶</button>
        <button id="restart" type="button" class="text-button">Start</button>
        <div class="time-readout">
          <strong id="utc-time">—</strong>
          <span id="elapsed-time">Elapsed —</span>
        </div>
        <label class="speed-label">Speed <select id="speed"><option value="1">1×</option><option value="3">3×</option><option value="10">10×</option></select></label>
      </div>
      <input id="time-slider" type="range" min="0" max="300" step="0.01" value="0" aria-label="Simulation time">
      <div class="timeline-ends"><span id="time-start">0:00</span><span id="time-end">5:00</span></div>
    </footer>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
